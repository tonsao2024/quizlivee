<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a0a54" />
<title>ONLIVE QUIZ — เกมตอบคำถามสดสำหรับการอบรม</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2361116c'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>Q</text></svg>" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="theme-join page-landing">

<div class="k-page">

  <header class="k-top">
    <button class="k-link" id="toggle-host" type="button" aria-haspopup="dialog" aria-controls="host-modal">สำหรับผู้จัด</button>
  </header>

  <main class="k-main">
    <div class="k-logo-big"><span>onlive</span> <em>quiz</em></div>

    <div class="k-card">
      <form class="k-join" id="join-form" autocomplete="off">
        <input id="pin-input" class="k-input" inputmode="numeric" maxlength="6"
               placeholder="Game PIN" aria-label="Game PIN" />
        <button class="btn-enter" type="submit">Enter</button>
      </form>
    </div>

    <p class="k-note">กรอก PIN ที่เห็นบนจอผู้จัด · ไม่ต้องสมัครสมาชิก</p>
  </main>
</div>

<!-- ============ ผู้จัด: หน้าต่างเข้าสู่ระบบ (ไม่ดันหน้าแรกให้ยาว/ต้องเลื่อน) ============ -->
<div class="modal hidden" id="host-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="host-title">
  <div class="modal-card auth-card" id="host">
    <button class="modal-close" id="host-close" type="button" aria-label="ปิดหน้าต่างเข้าสู่ระบบ">✕</button>
    <div class="card-head">
      <div class="card-title" id="host-title">สำหรับผู้จัด / แอดมิน</div>
      <span class="pill" id="host-badge">ต้องเข้าสู่ระบบ</span>
    </div>
    <div class="tabs" id="auth-tabs" style="margin-bottom:14px">
      <button type="button" data-mode="login" class="on">เข้าสู่ระบบ</button>
      <button type="button" data-mode="signup">สมัครใหม่</button>
    </div>
    <form id="auth-form" class="col" style="gap:12px">
      <label class="field" style="margin:0"><span>อีเมล</span>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
      </label>
      <label class="field" style="margin:0"><span>รหัสผ่าน</span>
        <span class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" />
          <button class="pw-toggle" id="toggle-password" type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false" title="แสดงรหัสผ่าน">
            <svg class="pw-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="pw-icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
              <path d="M3 3l18 18" />
            </svg>
          </button>
        </span>
      </label>
      <button class="btn-enter" id="auth-submit" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="tiny muted" style="margin-top:12px; line-height:1.6">
      บัญชีผู้จัดใช้สร้างชุดคำถาม เปิดห้อง และคุมเกม
    </p>
  </div>
</div>

<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/sound.js"></script>
<script src="assets/js/page-index.js"></script>
</body>
</html>
