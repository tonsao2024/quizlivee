name: ตรวจสอบ (tests)

# รันอัตโนมัติทุกครั้งที่ push และทุก pull request
# ใช้เป็น required status check ของ branch main ได้ (ชื่อ check: "check-assets")
# ไม่ต้องต่ออินเทอร์เน็ต — เทสต์ทั้งหมดรันออฟไลน์ด้วย jsdom

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-assets:
    name: check-assets
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v5

      - name: เตรียม Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: ตรวจไฟล์/ลิงก์ภายใน
        run: python3 tools/check-assets.py

      - name: ติดตั้ง jsdom (สำหรับทดสอบ DOM)
        run: npm install --no-audit --no-fund

      - name: ตรวจไวยากรณ์ไฟล์ JS ทั้งหมด
        run: |
          set -e
          for f in $(find docs/assets/js -name '*.js' -not -path '*/vendor/*'); do
            node --check "$f"
          done
          echo "ไวยากรณ์ถูกต้องทุกไฟล์"

      - name: ทดสอบ DOM (55 ข้อ)
        run: npm run test:ui

      - name: ทดสอบหน้าเว็บจริง (144 ข้อ)
        run: npm run test:e2e
        # ไม่ต้องมี static server — ตัวทดสอบเสิร์ฟไฟล์จาก docs/ เอง

      - name: ตรวจว่า migration ไม่ถูกลบ/แก้ชื่อ
        run: |
          set -e
          ls supabase/migrations/*.sql >/dev/null
          echo "พบ migration $(ls supabase/migrations/*.sql | wc -l) ไฟล์"
