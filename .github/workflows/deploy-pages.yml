name: Deploy web (GitHub Pages — ทางเลือกสำรอง)

# เว็บหลักของโปรเจกต์นี้ deploy ผ่าน Vercel (auto ทุกครั้งที่ push)
# workflow นี้เก็บไว้เป็นทางเลือกสำรองเท่านั้น จึงไม่รันอัตโนมัติ
# ถ้าต้องการขึ้น GitHub Pages จริง ๆ ให้กดรันเองที่ Actions → Run workflow
on:
  workflow_dispatch:

# สิทธิ์ที่ต้องใช้: อ่านโค้ด + เขียน Pages + ออก id-token ให้ deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# deploy ทีละครั้ง ไม่ให้ทับกัน (ไม่ยกเลิกงานที่กำลังรันอยู่)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ตรวจไฟล์ → เตรียม artifact
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v7

      - name: ตรวจว่าไฟล์/ลิงก์ภายในครบ (ไม่ครบ = หยุดก่อน deploy)
        run: python3 tools/check-assets.py

      - name: ตรวจการตั้งค่า GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "404" ]; then
            echo "::error title=ยังไม่ได้เปิด GitHub Pages::ไปที่ Settings → Pages → Source เลือก 'GitHub Actions' แล้วรัน workflow นี้ใหม่"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::warning title=ตรวจสถานะ Pages ไม่ได้::HTTP $code — จะลอง deploy ต่อ"
            exit 0
          fi

          build_type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))")
          echo "Pages build_type = ${build_type:-ไม่ทราบ}"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Pages ยังตั้งเป็น branch::Settings → Pages → Source เปลี่ยนเป็น 'GitHub Actions' ก่อน (ตอนนี้เป็น '$build_type')"
            exit 1
          fi

      - name: ตั้งค่า Pages
        uses: actions/configure-pages@v6

      - name: อัปโหลดโฟลเดอร์ docs เป็น artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: ขึ้น GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: สรุปผลในหน้า Actions
        run: |
          {
            echo "### ✅ Deploy เว็บสำเร็จ"
            echo ""
            echo "- เว็บ: ${{ steps.deployment.outputs.page_url }}"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- ไฟล์ที่ deploy: โฟลเดอร์ \`docs/\`"
          } >> "$GITHUB_STEP_SUMMARY"
